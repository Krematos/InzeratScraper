spring.application.name=InzeratScraper

# =========================================================================
# Síťové zabezpečení (výchozí bind pouze na localhost + volitelný API klíč)
# =========================================================================
server.address=127.0.0.1
migration.api.key=${MIGRATION_API_KEY:}

# =========================================================================
# Lokální H2 databáze (Staging úložiště) a záloha obrázků
# =========================================================================
spring.datasource.url=jdbc:h2:file:./data/staging-db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Omezení velikosti connection poolu pro ochranu H2 databáze při paralelním zpracování (Fáze 4.3)
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 Web Konzole (povolena pouze pro vývoj)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Bezpečnostní limity scraperu a stahování obrázků (ochrana proti zahlcení paměti / honeypotu)
scraper.max-pages=${SCRAPER_MAX_PAGES:50}
scraper.max-ads=${SCRAPER_MAX_ADS:500}
scraper.max-body-size-bytes=${SCRAPER_MAX_BODY_SIZE_BYTES:2097152}
scraper.images.dir=${SCRAPER_IMAGES_DIR:./data/images}
scraper.images.max-bytes=${SCRAPER_IMAGES_MAX_BYTES:10485760}
scraper.images.max-per-ad=${SCRAPER_IMAGES_MAX_PER_AD:20}
scraper.processing-timeout-minutes=${SCRAPER_PROCESSING_TIMEOUT_MINUTES:15}

# =========================================================================
# Konfigurace LLM (Gemini / OpenAI) a E-shopu
# =========================================================================
llm.api.url=${LLM_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent}
llm.api.key=${LLM_API_KEY:replace-with-api-key}
llm.max-attempts=${LLM_MAX_ATTEMPTS:5}

eshop.remote.url=${ESHOP_REMOTE_URL:http://localhost:8080}
eshop.remote.api-key=${ESHOP_REMOTE_API_KEY:replace-with-eshop-api-key}
eshop.categories=${ESHOP_CATEGORIES:Elektronika,PC a Notebooky,Dům a zahrada,Auto-moto,Oblečení,Sport,Ostatní}
